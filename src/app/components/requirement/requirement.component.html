<div class="row"> 
    <div class="col-10"></div>
    <div class="col-2">
          <button class="btn btn-primary" (click)="openModal()">Launch Modal</button>
    </div>
</div>
<div class="modal fade" tabindex="-1" #myModal aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Angular 19 Bootstrap Modal</h5>
          <button type="button" class="btn-close" (click)="closeModal()"></button>
        </div>
        <div class="modal-body">
          <p>Hello! This is a Bootstrap 5 modal controlled by Angular 19.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Close</button>
          <button type="button" class="btn btn-primary" (click)="closeModal()">Save changes</button>
        </div>
      </div>
    </div>
  </div>
